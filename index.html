<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>QK Judge - 移行のお知らせ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="3;url=https://qkjudge.kisen.one/" />
    <script>
      // JS が動く環境では meta refresh より先に即時遷移する。
      window.location.replace('https://qkjudge.kisen.one/')
    </script>
    <style>
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          'Hiragino Sans',
          sans-serif;
        background: #fafafa;
        color: #333;
        max-width: 640px;
        margin: 4em auto;
        padding: 0 1em;
        line-height: 1.7;
      }
      h1 {
        font-size: 1.8em;
        margin-bottom: 0.5em;
      }
      .url {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f0f0f0;
        padding: 0.2em 0.5em;
        border-radius: 4px;
      }
      a {
        color: #1976d2;
      }
      hr {
        border: none;
        border-top: 1px solid #e0e0e0;
        margin: 2em 0;
      }
    </style>
  </head>
  <body>
    <h1>QK Judge は移行しました</h1>
    <p>
      本サイトは <span class="url">https://qkjudge.kisen.one/</span>
      に移行しました。3 秒後に自動で遷移します。
    </p>
    <p>
      遷移しない場合:
      <a href="https://qkjudge.kisen.one/">https://qkjudge.kisen.one/ を開く</a>
    </p>
    <hr />
    <p>
      <strong>旧サイトのアカウントは引き継がれていません。</strong>
      新サイトでお手数ですが再度ユーザー登録をお願いします。
    </p>
  </body>
</html>
